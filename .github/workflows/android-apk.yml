name: Build Hesabino APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o hesabino_github_ready.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug
        working-directory: hesabino_android

      - uses: actions/upload-artifact@v4
        with:
          name: hesabino-apk
          path: hesabino_android/app/build/outputs/apk/debug/app-debug.apk
